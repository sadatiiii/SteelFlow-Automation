name: Validate source

on:
  push:
    branches: [main, "feat/python-sales-automation"]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python source
        run: python -m compileall -q automation/app
      - name: Check JavaScript syntax
        run: |
          node --check tabco/script.js
          node --check tabco/inquiry/inquiry.js
          node --check tabco/admin/drafts.js
          node --check 'tabco/functions/api/[[path]].js'
